aid: 30mhz
name: 30MHz
description: >-
  30MHz is a Rotterdam-based horticulture technology company that builds a wireless sensor network and
  the ZENSIE data platform for greenhouse and controlled-environment growers. Battery-powered sensors
  capture temperature, humidity, PAR/light, CO2, substrate moisture and EC in the crop, stream it to
  ZENSIE over LoRa gateways, and surface it as dashboards, maps, alerts, cultivation strategies and
  AI-generated growing advice. The platform integrates with climate computers (Priva, Hoogendoorn,
  Ridder) and third-party data services such as Meteomatics weather, and exposes a public REST API —
  the ZENSIE API at api.30mhz.com — covering sensors, checks (data sources), data query and ingest,
  dashboards, widgets, organizations, notifications, locations, zones, cultivations, licensing and
  billing, so growers, advisors and technology partners can push data into the platform and pull it
  back out into their own systems.
