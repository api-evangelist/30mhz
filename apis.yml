apis:
- name: ZENSIE API
  description: >-
    The ZENSIE REST API is 30MHz's public platform API, documented in Swagger at
    https://api.30mhz.com/api/swagger and served from https://api.30mhz.com/api. It carries 558
    operations across 425 paths covering sensors and sensor types, gateways and gateway clusters,
    checks (data sources), data query and data-upload/ingest, dashboards, widgets and charts, maps
    and zones, organizations, users, groups and notifications, cultivations and cultivation targets,
    apps (irrigation, GDD, RTR, CultiWatch), export partners, and the commercial surface (licenses,
    subscriptions, quotes, orders, invoices, pricing). Authentication is a bearer JWT API key issued
    from the ZENSIE Account Settings > Developer page and sent in the Authorization header.
  image: https://www.30mhz.com/wp-content/uploads/2026/04/Infographic-for-greenbg-1536x571.png
