note: >-
  Derived from the published ZENSIE Swagger 2.0 contract and from what 30mhz.com and
  support.30mhz.com actually publish. 30MHz makes no compliance or certification claim on its public
  site — no trust centre, no SOC 2 / ISO 27001 / GDPR statement page, no security.txt — so no
  Compliance or TrustCenter pointer is emitted. Horticulture has no widely-adopted API-level data
  standard analogous to FHIR or SCIM; the nearest candidates (AgGateway ADAPT, ISO 11783 / ISOBUS,
  the GS1 fresh-produce vocabularies) address farm machinery and supply chain rather than greenhouse
  climate telemetry, and the contract declares none of them. The domain-standard slot is therefore
  left unclaimed rather than filled — reward-only, and inventing one would be worse than an honest
  absence.
