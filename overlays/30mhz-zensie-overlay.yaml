    description: >-
      The ZENSIE REST API is 30MHz's platform API for horticulture sensor data. It covers wireless
      sensors and gateways, checks (data sources), time-series query and ingest, dashboards, widgets,
      maps and zones, organizations and users, cultivations, notifications, apps, and the commercial
      surface. Authentication is a bearer JWT API key created in the ZENSIE web app under Account
      Settings > Developer.
