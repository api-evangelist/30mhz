note: >-
  30MHz publishes a "What's new?" section in its support centre, split into "Monthly updates" and
  "Big platform updates". It is a PRODUCT changelog, not an API changelog, and it carries no dates
  and no version numbers — entries are titled by month name only ("February platform updates",
  "March platform update", "January updates: week numbers and weather data") with no year, and the
  article bodies contain no publication or update date. The underlying article IDs are legacy Zendesk
  360xxxxxxxx ids now served from HubSpot, and the newest entries describe chart and widget changes,
  so the section appears to have stopped being maintained. Nothing in it announces an API change, a
  new endpoint, a deprecation or a breaking change; the 19 operations marked deprecated in the
  contract are not mentioned. A consumer of the ZENSIE API has no changelog to watch.
