openapi: 3.2.0
info:
  version: '2.0'
  title: ZENSIE App Installation API
servers:
- url: https://api.30mhz.com/api
tags:
- name: App Installation
paths:
  /app-installation/{installationId}/activate:
    post:
      tags:
      - App Installation
      summary: Activate app installation
      description: Only system administrators can activate app installations.
      operationId: activateAppInstallation
      parameters:
      - name: installationId
        in: path
        required: true
        schema:
          type: string
      security:
      - Bearer: []
      responses:
        '200':
          description: App installation activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInstallation'
            application/zensie-v2+json:
              schema:
                $ref: '#/components/schemas/AppInstallation'
        '403':
          description: Not enough permissions to perform the operation.
        '404':
          description: App installation does not exist.
  /app-installation/{installationId}/deactivate:
    post:
      tags:
      - App Installation
      summary: Deactivate app installation
      description: Only system administrators can deactivate app installations.
      operationId: deactivateAppInstallation
      parameters:
      - name: installationId
        in: path
        required: true
        schema:
          type: string
      security:
      - Bearer: []
      responses:
        '200':
          description: App installation deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInstallation'
            application/zensie-v2+json:
              schema:
                $ref: '#/components/schemas/AppInstallation'
        '403':
          description: Not enough permissions to perform the operation.
        '404':
          description: App installation does not exist.
  /app-installation/{installationId}/configuration/{configKey}:
    put:
      tags:
      - App Installation
      summary: Put a dynamic configuration
      description: Authentication required for this operation.
      operationId: putDynamicConfiguration
      parameters:
      - name: installationId
        in: path
        required: true
        schema:
          type: string
      - name: configKey
        in: path
        required: true
        schema:
          type: string
      security:
      - Bearer: []
      responses:
        '200':
          description: Returns installation the put configuration belongs to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInstallation'
            application/zensie-v2+json:
              schema:
                $ref: '#/components/schemas/AppInstallation'
        '403':
          description: User must be authenticated.
        '404':
          description: Configuration not found.
        '510':
          description: Error - configuration not updated.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
    delete:
      tags:
      - App Installation
      summary: Delete a dynamic configuration
      description: Authentication required for this operation.
      operationId: deleteAppConfiguration
      parameters:
      - name: installationId
        in: path
        required: true
        schema:
          type: string
      - name: configKey
        in: path
        required: true
        schema:
          type: string
      security:
      - Bearer: []
      responses:
        '200':
          description: Return active dynamic configurations.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
            application/zensie-v2+json:
              schema:
                type: object
                additionalProperties:
                  type: object
        '403':
          description: User must be authenticated.
        '404':
          description: Installation not found.
        '510':
          description: Error - configuration not deleted.
    patch:
      tags:
      - App Installation
      summary: Patch a dynamic configuration, or creates it if does not exist
      description: Authentication required for this operation.
      operationId: patchDynamicConfiguration
      parameters:
      - name: installationId
        in: path
        required: true
        schema:
          type: string
      - name: configKey
        in: path
        required: true
        schema:
          type: string
      security:
      - Bearer: []
      responses:
        '200':
          description: Returns installation the patched configuration belongs to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInstallation'
            application/zensie-v2+json:
              schema:
                $ref: '#/components/schemas/AppInstallation'
        '403':
          description: User must be authenticated.
        '404':
          description: Installation not found.
        '510':
          description: Error - configuration not updated.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
  /app-installation/{installationId}:
    get:
      tags:
      - App Installation
      summary: Return app installation
      description: Authentication required for this operation.
      operationId: getAppInstallation
      parameters:
      - name: installationId
        in: path
        required: true
        schema:
          type: string
      - name: expandOrganization
        in: query
        description: Whether to return the organization it belongs to
        required: false
        schema:
          type: boolean
      security:
      - Bearer: []
      responses:
        '200':
          description: Returns app installation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInstallation'
            application/zensie-v2+json:
              schema:
                $ref: '#/components/schemas/AppInstallation'
        '403':
          description: Not enough permissions to perform the operation.
        '404':
          description: App installation does not exist.
    delete:
      tags:
      - App Installation
      summary: Uninstall a ZENSIE application
      description: Authentication required for this operation, authenticated user must have admin role.
      operationId: uninstallApp
      parameters:
      - name: installationId
        in: path
        required: true
        schema:
          type: string
      - name: permanently
        in: query
        required: false
        schema:
          type: boolean
      security:
      - Bearer: []
      responses:
        '204':
          description: Uninstall succeeded.
        '403':
          description: User is not authorized to perform operation, must be an admin.
        '404':
          description: AppInstallation not found.
        '510':
          description: Error - app not uninstalled.
  /app-installation/{installationId}/configuration:
    get:
      tags:
      - App Installation
      summary: Return installation's active configuration
      description: Authentication required for this operation.
      operationId: getAppInstallationConfiguration
      parameters:
      - name: installationId
        in: path
        required: true
        schema:
          type: string
      security:
      - Bearer: []
      responses:
        '200':
          description: Returns installation's active configuration.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
            application/zensie-v2+json:
              schema:
                type: object
                additionalProperties:
                  type: object
        '403':
          description: Not enough permissions to perform the operation.
        '404':
          description: Installation not found.
  /app-installation/{installationId}/configuration/{date}:
    get:
      tags:
      - App Installation
      summary: Return installation's configuration for a specific date
      description: Authentication required for this operation.
      operationId: getAppInstallationConfigurationAtDate
      parameters:
      - name: installationId
        in: path
        required: true
        schema:
          type: string
      - name: date
        in: path
        description: 'Date string. ISO 8601 date. E.g.: ''2016-03-03T00:00:00Z'''
        required: true
        schema:
          type: string
      security:
      - Bearer: []
      responses:
        '200':
          description: Returns installation's configuration for a specific date.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
            application/zensie-v2+json:
              schema:
                type: object
                additionalProperties:
                  type: object
        '403':
          description: Not enough permissions to perform the operation.
  /app-installation/{installationId}/configuration/prefix/{prefix}:
    get:
      tags:
      - App Installation
      summary: Returns app configurations with a given prefix
      description: Authentication required for this operation.
      operationId: getAppInstallationConfigurationWithPrefix
      parameters:
      - name: installationId
        in: path
        required: true
        schema:
          type: string
      - name: prefix
        in: path
        required: true
        schema:
          type: string
      security:
      - Bearer: []
      responses:
        '200':
          description: Returns app installation configurations with a specific prefix.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
            application/zensie-v2+json:
              schema:
                type: object
                additionalProperties:
                  type: object
        '403':
          description: Not enough permissions to perform the operation.
  /app-installation/organization/{organizationId}:
    get:
      tags:
      - App Installation
      summary: Return app installations for the organization
      description: Authentication required for this operation.
      operationId: getAppInstallations
      parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      - name: includeInactive
        in: query
        required: false
        schema:
          type: boolean
      security:
      - Bearer: []
      responses:
        '200':
          description: Returns app installations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppInstallation'
            application/zensie-v2+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppInstallation'
        '403':
          description: Not enough permissions to perform the operation.
  /app-installation/app/{appId}:
    get:
      tags:
      - App Installation
      summary: Return all active app installations with the given appId
      description: Authentication required for this operation, authenticated user must have admin role.
      operationId: getAppInstallationsForApp
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
      security:
      - Bearer: []
      responses:
        '200':
          description: Returns active app installations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppInstallation'
            application/zensie-v2+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppInstallation'
        '403':
          description: User is not authorized to perform operation, must be an admin.
  /app-installation/organization/{organizationId}/location/{locationId}/app/{appId}:
    post:
      tags:
      - App Installation
      summary: Install a ZENSIE application
      description: Authentication required for this operation
      operationId: installApp
      parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      - name: locationId
        in: path
        required: true
        schema:
          type: string
      - name: appId
        in: path
        required: true
        schema:
          type: string
      security:
      - Bearer: []
      responses:
        '201':
          description: App installed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppInstallation'
            application/zensie-v2+json:
              schema:
                $ref: '#/components/schemas/AppInstallation'
        '400':
          description: Configuration values must be either strings or json objects.
        '403':
          description: User must be authenticated.
        '500':
          description: Error while installing the app.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAppInstallation'
components:
  schemas:
    ImageThumbnail:
      type: object
      properties:
        height:
          type: integer
          format: int32
        path:
          type: string
        url:
          type: string
        width:
          type: integer
          format: int32
    DashboardTheme:
      type: object
      properties:
        createdByEmail:
          type: string
          description: Created by
        css:
          description: Dashboard theme css
          $ref: '#/components/schemas/DashboardThemeCSS'
        dashboardThemeId:
          type: string
          description: Dashboard theme id
        groupIds:
          type: array
          uniqueItems: true
          items:
            type: string
        logo:
          description: Dashboard logo
          $ref: '#/components/schemas/ImageWithThumbnails'
        logoDataUploadId:
          type: string
          description: Dashboard logo data upload id
        name:
          type: string
          description: Dashboard theme name
        organizationIds:
          type: array
          uniqueItems: true
          items:
            type: string
    CultivationPhaseDefinition:
      type: object
      required:
      - name
      - uuid
      properties:
        color:
          type: string
          description: Display color of the phase as a hex string, e.g. '#FAEEDA'.
          pattern: ^#[A-Fa-f0-9]{6}$
        name:
          type: string
          description: Name of the cultivation phase, from its organization-wide definition. Sent along a uuid it renames that definition, so the phase is renamed on every cultivation using it; sent without one it defines the phase.
          minLength: 0
          maxLength: 64
        uuid:
          type: string
          description: Universally unique identifier.
      description: Organization-wide definition of a cultivation phase.
    DataSourceCoordinates:
      type: object
      required:
      - dataSourceId
      - sinceDate
      properties:
        coordinateX:
          type: number
          format: double
          description: X coordinate in space
        coordinateY:
          type: number
          format: double
          description: Y coordinate in space
        sinceDate:
          type: string
          description: UTC ISO 8601 timestamp since when, e.g 2024-11-12T15:00:00Z.
        dataSourceId:
          type: string
          description: Identifier of the data source
        geoJson:
          type: object
          description: GeoJson definition.
          additionalProperties:
            type: object
        zoneName:
          type: string
          description: Name of the zone
        zoneUuid:
          type: string
          description: Unique identifier of the zone
      description: Coordinates of a data source since a given timestamp.
    Notification:
      type: object
      required:
      - notificationId
      properties:
        action:
          type: string
          description: Description of the action to take when the notification is triggered.
        calculationSettings:
          description: The calculation configuration
          $ref: '#/components/schemas/CalculationSettings'
        checkId:
          type: string
          description: Identifier of the check.
        condition:
          type: string
          description: Conditional that defines the trigger of this notification
        description:
          type: string
          description: Description of the notification
        eventHook:
          description: Event hook of the notification
          $ref: '#/components/schemas/EventHook'
        matchAfter:
          type: integer
          format: int32
          description: Match after attribute
          minimum: 0
        throttleFor:
          type: integer
          format: int64
          description: The amount of time in milliseconds to throttle notifications
          minimum: 0
        check:
          description: Summary of the check that is linked to this notification
          $ref: '#/components/schemas/CheckSummary'
        createdBy:
          type: string
          description: Identifier of the user that created this notification
        creationTimestamp:
          type: integer
          format: int64
          description: Timestamp of when the notification was created
        matched:
          type: boolean
          description: Matched attribute
        matchedFor:
          type: integer
          format: int32
          description: Matched for attribute
        matchedLastNotifiedAt:
          type: integer
          format: int64
          description: When the last matched notification was sent
        notificationId:
          type: string
          description: Identifier of this notification object.
        nrMatched:
          type: integer
          format: int32
          description: Number of matches attribute
        organizationId:
          type: string
          description: Identifier of the organization for which this notification is created
        resolvedLastNotifiedAt:
          type: integer
          format: int64
          description: When the last resolved notification was sent
        structuredConditional:
          type: array
          description: List of structured conditionals that defines the trigger event of this notification.
          items:
            $ref: '#/components/schemas/StructuredConditional'
        widgetIds:
          type: array
          description: List of structured conditionals that defines the trigger event of this notification.
          uniqueItems: true
          items:
            type: string
      description: Holds the editable properties of a Notification
    ImportCheck:
      type: object
      required:
      - name
      - notificationIds
      - notificationRelevance
      - notifications
      - sensorType
      - timezone
      properties:
        calculationSettings:
          description: The calculation settings if this is a calculation data source.
          $ref: '#/components/schemas/CalculationSettings'
        decimalsPerField:
          type: object
          description: The number of decimals used for each field of the data source.
          additionalProperties:
            type: integer
            format: int32
        description:
          type: string
          description: Brief description that elaborates on the name
        enabled:
          type: boolean
          description: Whether the data source is enabled.
        ingestedForIndices:
          type: object
          description: The data source's indexes for ingested values
          additionalProperties:
            type: array
            items:
              type: string
        integrationType:
          type: string
          description: Integration type.
        locationId:
          type: string
          description: Identifier of the site it belongs to, together with the organizationId this is unique.
        name:
          type: string
          description: Displayable name.
        notificationRelevance:
          type: integer
          format: int32
          description: The notification relevance for import check hits.
          minimum: 300
        rangePerJsonKey:
          type: object
          description: Min/max ranges for each json key of the data source.
          additionalProperties:
            type: array
            items:
              type: number
              format: double
        sensorType:
          type: string
          description: The sensor type.
        sourceId:
          type: string
          description: Optional source id.
        status:
          type: string
          description: The status of the data source, e.g. ACTIVE, DEACTIVATED or PAUSED.
          enum:
          - ACTIVE
          - DEACTIVATED
          - PAUSED
        tags:
          type: array
          description: The tags associated with the data source.
          uniqueItems: true
          items:
            type: string
        timezone:
          type: string
          description: An area which observes a uniform standard time.
        unitPerField:
          type: object
          description: Identifier of the preferred unit conversion for each field.
          additionalProperties:
            type: string
        useCollectionsAsRows:
          type: boolean
          description: Whether collections should be displayed as rows.
        zoneId:
          type: string
          description: Identifier of the zone within a site where the data source belongs.
        createdAt:
          type: string
          description: Timestamp of when it was created.
        cultivationHierarchyId:
          type: string
          description: 'Cultivation composite identifier of format: <cultivationId>#<plantGroupId>##<plantId>'
        dataSourceCoordinateHistory:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceCoordinates'
        dataSourceCoordinates:
          $ref: '#/components/schemas/DataSourceCoordinates'
        notificationIds:
          type: array
          description: Ids of the notifications for this check
          items:
            type: string
        notifications:
          type: array
          description: The notifications set for this sensor.
          items:
            $ref: '#/components/schemas/Notification'
        organizationId:
          type: string
          description: Identifier of the organization this data source belongs to.
        state:
          type: string
          description: 'The current state of the data source: UP or DOWN.'
        checkId:
          type: string
          description: Identifier of the data source
        collections:
          type: array
          description: Optional collections within data source data
          items:
            $ref: '#/components/schemas/CheckCollection'
        hasNotifications:
          type: boolean
          description: Does the data source have any notifications associated with it
        maxDecimals:
          type: integer
          format: int32
          description: Max decimals for fields of the data source.
        siteId:
          type: string
          description: Identifier of the site it belongs to, together with the organizationId this is unique.
      description: Import check properties
    ImageWithThumbnails:
      type: object
      properties:
        dataUploadId:
          type: string
        imageDimensions:
          $ref: '#/components/schemas/ImageDimensions'
        thumbnails:
          type: array
          items:
            $ref: '#/components/schemas/ImageThumbnail'
        url:
          type: string
    NewAppInstallation:
      type: object
      properties:
        description:
          type: string
          description: Installation's description.
        dynamicConfigurations:
          type: object
          additionalProperties:
            type: object
        name:
          type: string
          description: Installation's name.
    Check:
      type: object
      required:
      - checkId
      - enabled
      - frequency
      - hasNotifications
      - healthyThreshold
      - locationThreshold
      - maxReminders
      - method
      - name
      - notificationIds
      - notifications
      - organizationId
      - recentlyDownAt
      - remindEvery
      - state
      - statusCodes
      - timeout
      - unhealthyThreshold
      - url
      properties:
        allowRedirects:
          type: boolean
          description: Whether to follow redirects when a page returns HTTP code 302. Default is false.
        calculationId:
          type: string
          description: The id of the calculation called by the webcheck
        collectJson:
          type: boolean
          description: If the recollection of the JSON object has to be effectuated or not
        conditional:
          type: string
          description: A javascript expression that is applied to the json result and has to evaluate to true for the data source to be UP.
        contains:
          type: string
          description: Verify that the page returned contains this text, otherwise the data source will be reported as DOWN.
        containsNot:
          type: string
          description: Verify that the page returned does NOT contain this text, if it does, the data source will be reported as DOWN.
        cookies:
          type: string
          description: Send these cookies in each request when pinging the data source. You can use this, for example, for adding authentication data.
        cron:
          type: string
          description: Only run this data source in the given schedule. This is written in Unix-like notation. For example, to run it only weekdays 8 to 17, write '* * 8-17 ? * MON-FRI'
        data:
          type: string
          description: Payload to send, usually for POST or PUT methods
        decimalsPerField:
          type: object
          description: The number of decimals used for each field of the data source.
          additionalProperties:
            type: integer
            format: int32
        description:
          type: string
          description: Brief description that elaborates on the name
        email:
          type: string
          description: Email address.
        enabled:
          type: boolean
          description: Whether the data source is enabled.
        frequency:
          type: integer
          format: int32
          description: The frequency with which the data source is pinged, in seconds.
        gatewayId:
          type: string
          description: Identifier of the gateway the data source belongs to.
        headers:
          type: string
          description: Send these HTTP headers in each request when pinging the data source. You can use this, for example, for adding authentication data.
        healthyThreshold:
          type: integer
          format: int32
          description: How many consecutive successful responses indicate that the data source is up.
        locationThreshold:
          type: integer
          format: int64
          description: How many locations indicate the data source is up/down.
        locations:
          type: array
          description: From which locations to ping the data source from.
          uniqueItems: true
          items:
            type: string
        maxDecimals:
          type: integer
          format: int32
          description: Max decimals for fields of the data source.
        maxReminders:
          type: integer
          format: int32
          description: The maximum number of times you want to be notified if DOWN.
        method:
          type: string
          description: HTTP method (get/post/put/delete) to user for pinging the data source
        name:
          type: string
          description: Displayable name.
        organizationId:
          type: string
          description: Identifier of the organization this data source belongs to.
        params:
          type: string
          description: Send these HTTP parameters in each request when pinging the data source.
        remindEvery:
          type: integer
          format: int32
          description: Every how many seconds to send another notification if data source is still DOWN. (See also Number of reminders).
        sensorType:
          type: string
          description: The sensor type.
        siteId:
          type: string
          description: Identifier of the site it belongs to, together with the organizationId this is unique.
        status:
          type: string
          description: The status of the data source, e.g. ACTIVE, DEACTIVATED or PAUSED.
          enum:
          - ACTIVE
          - DEACTIVATED
          - PAUSED
        statusCodes:
          type: array
          description: What HTTP status code are expected when pinging the data source. If the received HTTP status is not in this list, the data source will be reported as DOWN.
          uniqueItems: true
          items:
            type: integer
            format: int32
          maxItems: 2147483647
          minItems: 1
        stream:
          type: boolean
          description: Whether the stream is enabled for the response validation
        tags:
          type: array
          description: The tags associated with the data source.
          uniqueItems: true
          items:
            type: string
        timeout:
          type: integer
          format: int32
          description: How long we wait for the data source to respond before we consider it down.
        timezone:
          type: string
          description: An area which observes a uniform standard time.
        unhealthyThreshold:
          type: integer
          format: int32
          description: How many consecutive failed responses indicate that the data source is down.
        units:
          type: array
          description: The units associated with the sensor data source.
          uniqueItems: true
          items:
            type: string
        url:
          type: string
          description: The URL of the data source.
        verify:
          type: boolean
          description: Whether SSL verification is enabled.
        zoneId:
          type: string
          description: Identifier of the zone within a site where the data source belongs.
        rangePerJsonKey:
          type: object
          description: Min/max ranges for each json key of the data source.
          additionalProperties:
            type: array
            items:
              type: number
              format: double
        timezoneOffset:
          type: integer
          format: int64
          description: Offset of the timezone in minutes.
        batteryStatus:
          type: string
          description: The battery status warnings or errors associated with this data source. Expected values are OK, WARNING and CRITICAL.
        checkId:
          type: string
          description: Identifier of the data source
        createdAt:
          type: string
          description: Timestamp of when it was created.
        dataSourceCoordinateHistory:
          type: array
