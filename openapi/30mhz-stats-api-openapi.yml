      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckStatsRequest'
  /stats/network/organization/{organizationId}:
    get:
      tags:
      - Stats
      summary: Gets the Network (web checks, sensor checks, routers, and mothers) status…
      description: Operation reserved to administrators.
      operationId: getNetworkStatusOverview
      parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
      security:
      - Bearer: []
      responses:
        '200':
          description: Network (web checks, sensor checks, routers, and mothers) status overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkOverviewResponse'
            application/zensie-v2+json:
              schema:
                $ref: '#/components/schemas/NetworkOverviewResponse'
        '403':
          description: User is not authorized to perform this operation.
        '404':
          description: Organization with given id doesn't exist
components:
  schemas:
    StatisticsInfoRequest:
