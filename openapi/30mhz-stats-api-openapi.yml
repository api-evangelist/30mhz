          format: int32
        onlineWebChecks:
          type: integer
          format: int32
        pausedRouters:
          type: integer
          format: int32
        pausedSensors:
          type: integer
          format: int32
        pausedWebChecks:
          type: integer
          format: int32
        totalGateways:
